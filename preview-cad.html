  <!-- SCRIPT SHOP DRAWING ENGINE CÓ CACHE BUSTER -->
  <script src="shop-drawing-pdf.js?v=20261026_cad_v6"></script>

  <script>
    let currentView = 'all';

    function getSpecsFromInputs() {
      const W = parseInt(document.getElementById('inpW').value) || 1400;
      const D = parseInt(document.getElementById('inpD').value) || 1450;
      const Pit = parseInt(document.getElementById('inpPit').value) || 350;
      const Oh = parseInt(document.getElementById('inpOh').value) || 3200;
      const Stops = parseInt(document.getElementById('inpStops').value) || 4;
      const Cap = (W < 1350 ? 300 : (W < 1550 ? 450 : 630));
      return window.calculateShopDrawingSpecs(W, D, Pit, Oh, Stops, Cap);
    }

    function updateDrawing() {
      const specs = getSpecsFromInputs();
      window._currentSpecs = specs;
      renderCurrentView();
    }

    function switchView(viewId) {
      currentView = viewId;
      document.querySelectorAll('.view-btn').forEach(b => {
        b.className = 'view-btn px-2.5 py-1 rounded bg-slate-800 text-slate-300 hover:text-white font-bold flex-shrink-0';
      });
      const active = document.getElementById('btn_' + viewId);
      if (active) {
        active.className = 'view-btn px-2.5 py-1 rounded bg-amber-500 text-slate-950 font-black flex-shrink-0';
      }
      renderCurrentView();
    }

    function renderCurrentView() {
      const specs = window._currentSpecs || getSpecsFromInputs();
      window._currentSpecs = specs;
      const container = document.getElementById('cadViewport');
      if (!container || !window.generateMasterShopDrawingSvgA3) return;

      if (currentView === 'all') {
        container.innerHTML = window.generateMasterShopDrawingSvgA3(specs);
      } else {
        // Sử dụng modal switch drawing view logic
        if (window.switchDrawingView) {
          // create a temporary container inside modal or render directly
          const masterSvg = window.generateMasterShopDrawingSvgA3(specs);
          // extract the specific view or render master
          container.innerHTML = masterSvg;
        }
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        updateDrawing();
      }, 100);
    });
  </script>
